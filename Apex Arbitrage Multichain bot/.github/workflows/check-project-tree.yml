name: Check Project Tree Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-tree:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Run project tree sync check
      run: node scripts/check-project-tree.js