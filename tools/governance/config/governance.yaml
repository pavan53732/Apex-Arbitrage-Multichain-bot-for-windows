repo_root: "."
docs_globs:
  - "docs/*.md"
  - "docs/adr/*.md"
  - "*.md"
schemas_glob: "schemas/*.json"
scripts_glob: "scripts/**/*"
architecture_tests_glob: "architecture-tests/**/*"

metadata_fields:
  required:
    - type
    - owner
    - status
    - version
  optional:
    - purpose
    - scope
    - responsibilities
    - owns
    - does_not_own
    - inputs
    - outputs
    - depends_on
    - required_by
    - interfaces
    - events_produced
    - events_consumed
    - configuration
    - schemas
    - state_machines
    - security
    - recovery
    - failure_behaviour
    - performance
    - validation
    - testing
    - cross_references
    - version_history
    - canonical_source

document_types:
  - CONTRACT
  - SPECIFICATION
  - DESIGN
  - RUNBOOK
  - REFERENCE
  - INDEX
  - OVERVIEW
  - SUPPORT
  - GOVERNANCE
  - ADR
  - SCHEMA
  - NAVIGATION
  - ASSISTANT_GATE

behavioural_root_signals:
  - CONTRACT
  - Engine
  - Pipeline
  - Runtime
  - Kernel
  - Orchestrator
  - Workflow
  - Bus
  - Lifecycle
  - Coordinator
  - Manager
  - Builder

tier_a_patterns:
  - "*-ENGINE.md"
  - "*-PIPELINE.md"
  - "ORCHESTRATOR.md"
  - "APEX-KERNEL.md"
  - "EVENT-BUS.md"
  - "SECURITY.md"
  - "CONFIGURATION.md"
  - "STATE-MANAGEMENT.md"
  - "IPC-PROTOCOL.md"
  - "RUNTIME-OPERATIONS.md"
  - "TRADING-ENGINE.md"
  - "EXECUTION-ENGINE.md"
  - "RISK-ENGINE.md"
  - "SIMULATION-ENGINE.md"
  - "DECISION-ENGINE.md"
  - "POLICY-ENGINE.md"
  - "SERVICE-REGISTRY.md"
  - "BOOTSTRAP-SEQUENCE.md"

storage:
  db_path: ".governance/governance.db"
  export_dir: ".governance/exports"
  progress_path: ".governance/GOVERNANCE-PROGRESS.json"
  graphs_dir: ".governance/graphs"
  root_lifecycle_overrides_path: ".governance/root_lifecycle_overrides.json"
  closures_dir: ".governance/closures"
  # WS5 (Database Consolidation): schema version is the single source
  # of truth in tools/governance/storage/schema.py's SCHEMA_VERSION
  # constant, stored live in the database via SQLite's PRAGMA
  # user_version. This config value is documentation only (kept in sync
  # by tests/test_schema.py::test_schema_version_is_documented_in_this_module
  # and by IntegrityEngine.check_database(), which compares the live
  # database's PRAGMA user_version against schema.py's SCHEMA_VERSION
  # directly, NOT against this yaml value) -- never read by code as the
  # authoritative version number.
  documented_schema_version: 1

completeness:
  critical_threshold: 0.85
  sections:
    - purpose
    - scope
    - responsibilities
    - owns
    - does_not_own
    - inputs
    - outputs
    - interfaces
    - events_produced
    - events_consumed
    - configuration
    - schemas
    - state_machines
    - security
    - recovery
    - failure_behaviour
    - performance
    - validation
    - testing
    - cross_references
    - version_history
    - canonical_source
